---
- name: A2 - Eigen Experiment (Webserver Nginx)
  hosts: localhost
  become: yes
  tasks:
    - name: 1. Update de software lijst
      apt:
        update_cache: yes

    - name: 2. Installeer Nginx Webserver
      apt:
        name: nginx
        state: latest

    - name: 3. Zorg dat Nginx aan staat
      service:
        name: nginx
        state: started
        enabled: yes
    - name: 4. Maak een eigen Nginx pagina
      copy:
        content: "<h1>Dit is Nginx (Opdracht A2)</h1><p>En Apache is nu weg!</p>"
        dest: /var/www/html/index.html
